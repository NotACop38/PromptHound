[PromptHound - Unsanitized LLM Output Reached an Interpreter or Renderer]
description = Detects model output that reached a SQL, shell, code-evaluation or HTML sink without sanitization, as reported by the application's output-handling instrumentation. Output treated as trusted by an interpreter is how prompt injection becomes SQL injection, command execution or cross-site scripting. Markdown sinks are excluded because unsanitized Markdown rendering is usually a standing configuration issue rather than an event; audit it separately. Level: high. Rule ID: 3bc7ddec-e008-450b-950c-263f73f90440.
search = `prompthound_audit` output_rendered_unsanitized=true output_sink IN ("sql_exec", "shell_exec", "code_eval", "html_render")
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
enableSched = 0

