[PromptHound - Sensitive-Read and Egress Tools in One Agent Tool Chain]
description = Detects an agent tool chain that includes both a tool that reads sensitive data (files, databases, secrets, mailboxes) and a tool that sends data out (email, HTTP, webhooks, uploads). The combination is the shape of data exfiltration through agent tools. The rule tests co-occurrence only: it does not see call order, arguments, destinations or authorization. Tool names must match exactly (case-insensitively); replace the lists with your application's tool inventory, including namespaces. Level: medium. Rule ID: 2f8b1d4c-6e3a-4c1b-9d72-7a4e5f0c8b21.
search = `prompthound_audit` gen_ai_operation_name IN ("execute_tool", "invoke_agent") "tool_call_chain{}" IN ("read_file", "fs.read", "db.query", "sql.query", "secrets.get", "vault.read", "kv.get", "read_email", "inbox.read", "get_credentials") "tool_call_chain{}" IN ("send_email", "http.post", "http.request", "fetch_url", "upload_file", "post_webhook", "slack.post", "sftp.put")
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
enableSched = 0

[PromptHound - Repeated Denied Tool Calls in One Conversation]
description = Detects three or more denied tool calls within one conversation in a fixed 5-minute window. An agent that keeps invoking tools its policy refuses is probing for a path around the policy, often because injected instructions are steering it. One denial is routine; repetition is the signal. Level: medium. Rule ID: 4b7d2f81-3a59-46c0-9e1d-8f5b2c7a0e63.
search = `prompthound_audit` gen_ai_operation_name IN ("execute_tool", "invoke_agent") tool_call_outcome="denied" \
| bin _time span=5m \
| stats count as event_count by _time user_tenant_id gen_ai_conversation_id \
| search event_count >= 3
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
enableSched = 0

