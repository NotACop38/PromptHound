[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "prompthound"
dynamic = ["version"]
description = "Sigma detection rules for LLM applications and AI agents, with verified Splunk and Microsoft Sentinel queries and an offline test harness."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 AND DRL-1.1"
license-files = ["LICENSE", "LICENSE-RULES", "NOTICE"]
authors = [{ name = "PromptHound contributors" }]
keywords = [
  "sigma",
  "detection-engineering",
  "siem",
  "splunk",
  "microsoft-sentinel",
  "kql",
  "llm-security",
  "ai-agents",
  "mitre-atlas",
  "owasp",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "pysigma>=1.5,<2",
  "pysigma-backend-splunk>=2.1,<3",
  "pysigma-backend-kusto>=1.0.1,<2",
  "pyyaml>=6.0.1",
]

[project.scripts]
prompthound = "prompthound.cli:main"

[project.urls]
Homepage = "https://github.com/NotACop38/PromptHound"
Documentation = "https://github.com/NotACop38/PromptHound/tree/main/docs"
Issues = "https://github.com/NotACop38/PromptHound/issues"
Changelog = "https://github.com/NotACop38/PromptHound/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "bandit>=1.9",
  "mypy>=2.3",
  "pip-audit>=2.10",
  "pytest>=9.1",
  "pytest-cov>=7.1",
  "ruff>=0.16",
  "types-PyYAML>=6.0",
]

[tool.hatch.version]
path = "src/prompthound/__init__.py"

# The wheel bundles the rule pack and its scenarios inside the package. Editable
# installs read them from the checkout instead (see prompthound.resources).
[tool.hatch.build.targets.wheel]
only-include = ["src/prompthound", "rules", "scenarios"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"rules" = "prompthound/_bundled/rules"
"scenarios" = "prompthound/_bundled/scenarios"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/rules",
  "/scenarios",
  "/siem",
  "/docs",
  "/tests",
  "/scripts",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/Makefile",
  "/requirements.lock",
  "/requirements-dev.lock",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "src"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "PIE",
  "PT",
  "RET",
  "PTH",
  "RUF",
  "S",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert by design and build throwaway files from literals.
"tests/**" = ["S101", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "scripts", "tests"]
# Scripts and tests are imported as `scripts.*` and `tests.*` from the repository root.
mypy_path = ["src", "."]
explicit_package_bases = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["prompthound"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]
