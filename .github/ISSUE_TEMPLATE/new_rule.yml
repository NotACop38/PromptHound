name: Rule proposal
description: Propose a detection rule for PromptHound.
title: "[rule] "
labels: ["rule"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the behavior as it appears in audit events. Do not paste working
        payloads or real credentials. See
        [docs/authoring.md](https://github.com/NotACop38/PromptHound/blob/main/docs/authoring.md)
        for the rule format and the supported Sigma subset.
  - type: textarea
    id: behavior
    attributes:
      label: Behavior
      description: What the rule detects, why it indicates an attack or misuse, and the schema fields it reads.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - prompt_injection
        - system_prompt_extraction
        - jailbreak
        - data_exfiltration
        - agent_tool_abuse
        - dos_cost_abuse
        - insecure_output
        - other (explain under Behavior)
    validations:
      required: true
  - type: dropdown
    id: telemetry
    attributes:
      label: Telemetry
      description: The most sensitive data class the rule needs.
      options:
        - Metadata only
        - Output of a content detector
        - Raw prompt or response content
    validations:
      required: true
  - type: input
    id: mappings
    attributes:
      label: Mappings
      description: OWASP LLM Top 10 2025, OWASP Agentic Top 10 2026 (agent rules), and MITRE ATLAS or ATT&CK.
      placeholder: LLM06, ASI02, AML.T0053
    validations:
      required: true
  - type: textarea
    id: cases
    attributes:
      label: Scenario cases
      description: Event sequences that must alert, and near misses that must stay silent.
    validations:
      required: true
  - type: textarea
    id: falsepositives
    attributes:
      label: False positives
      description: Benign activity that would match, and how to scope or tune for it.
    validations:
      required: true
