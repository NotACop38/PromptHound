name: Bug report
description: A rule, query, conversion, command or document behaves incorrectly.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report security vulnerabilities privately instead; see
        [SECURITY.md](https://github.com/NotACop38/PromptHound/blob/main/SECURITY.md).
  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: What you observed and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >-
        The command you ran and its output, and the rule, query or event involved.
        Remove prompts, responses and identifiers from production events first.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `prompthound --version`, or the commit.
    validations:
      required: true
  - type: input
    id: siem
    attributes:
      label: SIEM and version
      description: For query problems, for example Splunk Enterprise 10.4 or Microsoft Sentinel.
    validations:
      required: false
