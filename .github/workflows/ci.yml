# PromptHound hosted CI: runs the same ordered gate as `make ci` on every pull
# request and every push to main, so a contribution is checked by exactly the
# sequence a contributor runs locally (scripts/ci.py is the single source of
# truth). PR branches are covered by the pull_request trigger; restricting the
# push trigger to main avoids running every gate twice on PR branches.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock -r requirements-dev.lock -e .

      - name: Run the CI gate (lint → schema → convert → tests → coverage → security)
        run: python scripts/ci.py
