# Runs the generated queries in Splunk Enterprise and the Kusto emulator and
# compares their results with the offline evaluator (docs/verification.md).
# Manual only: starting the containers accepts the Splunk General Terms and the
# Kusto emulator's license.
name: Verify SIEM queries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (Splunk and Kusto)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Free disk space for the engine images
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Verify
        run: python scripts/verify_siem.py --containers
