<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="PromptHound architecture: a Sigma rule is converted by pySigma into Splunk SPL and Sentinel KQL for your SIEM, and proven by pytest with an auto-generated coverage map">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b303b"/>
      <stop offset="1" stop-color="#21252e"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7b88a1"/>
    </marker>
  </defs>

  <rect width="1240" height="520" rx="18" fill="url(#pbg)"/>

  <text x="40" y="50" font-size="22" font-weight="800" fill="#eceff4">Author once · ship to every SIEM · prove it offline</text>
  <text x="40" y="74" font-size="13" fill="#8a93a3">One Sigma rule on a documented, OTel-aligned audit-log schema — converted, tested, and mapped automatically.</text>
  <line x1="40" y1="90" x2="1200" y2="90" stroke="#434c5e" stroke-width="1"/>

  <!-- ===== main pipeline ===== -->
  <!-- Stage 1: Sigma rule -->
  <g transform="translate(40,140)">
    <rect width="250" height="150" rx="12" fill="#353b48"/>
    <rect width="6" height="150" rx="3" fill="#a3be8c"/>
    <text x="24" y="40" font-size="19" font-weight="800" fill="#eceff4">Sigma rule</text>
    <text x="24" y="66" font-size="12.5" fill="#9aa5b8">authored once · vendor-neutral</text>
    <rect x="24" y="84" width="202" height="44" rx="7" fill="#262b34"/>
    <text x="36" y="104" font-size="11.5" fill="#88c0d0" font-family="SFMono-Regular,Consolas,Menlo,monospace">detection:</text>
    <text x="36" y="120" font-size="11.5" fill="#d8dee9" font-family="SFMono-Regular,Consolas,Menlo,monospace">condition: markers and …</text>
  </g>

  <!-- Stage 2: pySigma -->
  <g transform="translate(395,155)">
    <rect width="180" height="120" rx="12" fill="#353b48"/>
    <rect width="6" height="120" rx="3" fill="#88c0d0"/>
    <text x="24" y="44" font-size="19" font-weight="800" fill="#eceff4">pySigma</text>
    <text x="24" y="70" font-size="12.5" fill="#9aa5b8">backend</text>
    <text x="24" y="88" font-size="12.5" fill="#9aa5b8">conversion</text>
  </g>

  <!-- Stage 3: outputs -->
  <g transform="translate(660,135)">
    <rect width="250" height="74" rx="12" fill="#353b48"/>
    <rect width="6" height="74" rx="3" fill="#81a1c1"/>
    <text x="24" y="34" font-size="17" font-weight="800" fill="#eceff4">Splunk SPL</text>
    <text x="24" y="56" font-size="12" fill="#9aa5b8" font-family="SFMono-Regular,Consolas,Menlo,monospace">out/splunk/ · savedsearches.conf</text>
  </g>
  <g transform="translate(660,221)">
    <rect width="250" height="74" rx="12" fill="#353b48"/>
    <rect width="6" height="74" rx="3" fill="#88c0d0"/>
    <text x="24" y="34" font-size="17" font-weight="800" fill="#eceff4">Sentinel KQL</text>
    <text x="24" y="56" font-size="12" fill="#9aa5b8" font-family="SFMono-Regular,Consolas,Menlo,monospace">out/kusto/</text>
  </g>

  <!-- Stage 4: SIEM -->
  <g transform="translate(990,150)">
    <rect width="210" height="130" rx="12" fill="#3b4252"/>
    <rect width="6" height="130" rx="3" fill="#b48ead"/>
    <text x="24" y="44" font-size="19" font-weight="800" fill="#eceff4">Your SIEM</text>
    <text x="24" y="72" font-size="12.5" fill="#9aa5b8">alerts fire in</text>
    <text x="24" y="92" font-size="12.5" fill="#d8dee9" font-weight="700">Splunk + Sentinel</text>
    <text x="24" y="112" font-size="12" fill="#9aa5b8">no live model touched</text>
  </g>

  <!-- arrows -->
  <g stroke="#7b88a1" stroke-width="2.4" fill="none" marker-end="url(#arr)">
    <line x1="294" y1="215" x2="391" y2="215"/>
    <path d="M579 200 C 620 200, 620 172, 656 172"/>
    <path d="M579 230 C 620 230, 620 258, 656 258"/>
    <path d="M914 172 C 955 172, 955 210, 986 210"/>
    <path d="M914 258 C 955 258, 955 222, 986 222"/>
  </g>

  <!-- ===== proof lane ===== -->
  <line x1="40" y1="350" x2="1200" y2="350" stroke="#434c5e" stroke-width="1" stroke-dasharray="4 5"/>
  <text x="40" y="380" font-size="13" font-weight="700" fill="#8a93a3" letter-spacing="1">PROVEN &amp; MAPPED — OFFLINE, FROM THE SAME RULE</text>

  <g transform="translate(40,398)">
    <rect width="370" height="92" rx="12" fill="#2e3440" stroke="#434c5e" stroke-width="1"/>
    <rect width="6" height="92" rx="3" fill="#ebcb8b"/>
    <text x="24" y="36" font-size="16" font-weight="800" fill="#eceff4">Synthetic test data</text>
    <text x="24" y="60" font-size="12.5" fill="#9aa5b8">positive + negative log signatures</text>
    <text x="24" y="79" font-size="12.5" fill="#9aa5b8">per rule — no live LLM, byte-reproducible</text>
  </g>
  <g transform="translate(435,398)">
    <rect width="370" height="92" rx="12" fill="#2e3440" stroke="#434c5e" stroke-width="1"/>
    <rect width="6" height="92" rx="3" fill="#a3be8c"/>
    <text x="24" y="36" font-size="16" font-weight="800" fill="#eceff4">pytest fire / silence</text>
    <text x="24" y="60" font-size="12.5" fill="#9aa5b8">fires on the attack sample,</text>
    <text x="24" y="79" font-size="12.5" fill="#9aa5b8">stays quiet on the benign one</text>
  </g>
  <g transform="translate(830,398)">
    <rect width="370" height="92" rx="12" fill="#2e3440" stroke="#434c5e" stroke-width="1"/>
    <rect width="6" height="92" rx="3" fill="#88c0d0"/>
    <text x="24" y="36" font-size="16" font-weight="800" fill="#eceff4">OWASP × ATLAS coverage map</text>
    <text x="24" y="60" font-size="12.5" fill="#9aa5b8">generated from rule metadata only —</text>
    <text x="24" y="79" font-size="12.5" fill="#9aa5b8">can never go stale</text>
  </g>

  <!-- connector from Sigma rule down into proof lane -->
  <path d="M165 290 L165 397" stroke="#7b88a1" stroke-width="2.4" fill="none" stroke-dasharray="4 5" marker-end="url(#arr)"/>
</svg>
