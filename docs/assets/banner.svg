<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="PromptHound — experimental detections for LLM applications and AI agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b303b"/>
      <stop offset="1" stop-color="#20242c"/>
    </linearGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#88c0d0"/>
      <stop offset="0.55" stop-color="#8fbcbb"/>
      <stop offset="1" stop-color="#a3be8c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#88c0d0"/>
      <stop offset="1" stop-color="#a3be8c"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#88c0d0"/>
      <stop offset="1" stop-color="#a3be8c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#5e81ac" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5e81ac" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#a3be8c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a3be8c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="380" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="22" fill="url(#glowA)"/>
  <rect width="1280" height="380" rx="22" fill="url(#glowB)"/>

  <!-- faint scan grid -->
  <g stroke="#434c5e" stroke-width="1" opacity="0.18">
    <line x1="0" y1="95"  x2="1280" y2="95"/>
    <line x1="0" y1="190" x2="1280" y2="190"/>
    <line x1="0" y1="285" x2="1280" y2="285"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(70,90)">
    <line x1="125" y1="125" x2="172" y2="172" stroke="#3b4252" stroke-width="26" stroke-linecap="round"/>
    <line x1="125" y1="125" x2="172" y2="172" stroke="url(#ring)" stroke-width="15" stroke-linecap="round"/>
    <circle cx="88" cy="88" r="62" fill="#262b34"/>
    <circle cx="88" cy="88" r="62" fill="none" stroke="url(#ring)" stroke-width="13"/>
    <circle cx="68" cy="68" r="16" fill="#ffffff" opacity="0.10"/>
    <g fill="#88c0d0">
      <ellipse cx="88" cy="104" rx="22" ry="18"/>
      <circle cx="62"  cy="82" r="9"/>
      <circle cx="78"  cy="70" r="10"/>
      <circle cx="98"  cy="70" r="10"/>
      <circle cx="114" cy="82" r="9"/>
    </g>
  </g>

  <!-- wordmark + copy -->
  <text x="300" y="150" font-size="74" font-weight="800" fill="url(#wm)" letter-spacing="-1">PromptHound</text>
  <rect x="304" y="172" width="300" height="4" rx="2" fill="url(#rule)"/>

  <text x="304" y="214" font-size="20.5" font-weight="600" fill="#e5e9f0">Experimental detections for LLM applications &amp; AI agents.</text>
  <text x="304" y="247" font-size="17" fill="#9aa5b8">Author once in <tspan fill="#a3be8c" font-weight="700">Sigma</tspan>  →  ship to <tspan fill="#ebcb8b" font-weight="700">Splunk SPL</tspan> and <tspan fill="#81a1c1" font-weight="700">Microsoft Sentinel KQL</tspan>.</text>

  <!-- capability pills -->
  <g font-size="14" font-weight="700">
    <g transform="translate(304,288)">
      <rect width="150" height="34" rx="17" fill="#3b4252"/>
      <circle cx="20" cy="17" r="5" fill="#a3be8c"/>
      <text x="34" y="22" fill="#d8dee9">15 Sigma rules</text>
    </g>
    <g transform="translate(466,288)">
      <rect width="196" height="34" rx="17" fill="#3b4252"/>
      <circle cx="20" cy="17" r="5" fill="#88c0d0"/>
      <text x="34" y="22" fill="#d8dee9">OWASP LLM Top 10 + ATLAS</text>
    </g>
    <g transform="translate(674,288)">
      <rect width="210" height="34" rx="17" fill="#3b4252"/>
      <circle cx="20" cy="17" r="5" fill="#ebcb8b"/>
      <text x="34" y="22" fill="#d8dee9">Proven by pytest · zero live LLM</text>
    </g>
  </g>
</svg>
