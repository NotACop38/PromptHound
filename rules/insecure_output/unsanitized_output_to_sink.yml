title: Unsanitized LLM Output Reached an Interpreter or Renderer
id: 3bc7ddec-e008-450b-950c-263f73f90440
status: experimental
description: |
    Detects model output that reached a SQL, shell, code-evaluation or HTML sink without
    sanitization, as reported by the application's output-handling instrumentation. Output
    treated as trusted by an interpreter is how prompt injection becomes SQL injection,
    command execution or cross-site scripting. Markdown sinks are excluded because
    unsanitized Markdown rendering is usually a standing configuration issue rather than an
    event; audit it separately.
references:
    - https://genai.owasp.org/llmrisk/llm052025-improper-output-handling/
    - https://attack.mitre.org/techniques/T1059/
author: PromptHound contributors
date: 2026-06-04
modified: 2026-09-26
license: DRL-1.1
tags:
    - attack.execution
    - attack.t1059
logsource:
    product: llm_gateway
detection:
    unsanitized:
        output.rendered_unsanitized: true
    dangerous_sink:
        output.sink:
            - 'sql_exec'
            - 'shell_exec'
            - 'code_eval'
            - 'html_render'
    condition: unsanitized and dangerous_sink
falsepositives:
    - Consumers that sanitize or escape output after the point where the instrumentation records it; confirm the downstream control before dismissing.
    - Internal tools that evaluate trusted, templated output in a sandbox; scope by service.name.
level: high
prompthound:
    owasp_llm: [LLM05]
    owasp_agentic: [ASI05]
