title: Injection Phrase in Retrieval-Augmented Input from Untrusted Sources
id: fac11223-21c0-48f6-afcb-bdc6a7ac630f
status: experimental
description: |
    Detects an instruction-override phrase in the input of an operation that retrieved
    content from an untrusted source type (web, email, file or ticket), when the
    injection-marker detector also scored the input. This is the log signature of indirect
    prompt injection, where instructions planted in retrieved content reach the model's
    context. The rule cannot tell which message carried the phrase: a user who types it
    during a retrieval-augmented session also matches.
references:
    - https://genai.owasp.org/llmrisk/llm01-prompt-injection/
    - https://atlas.mitre.org/techniques/AML.T0051.001
    - https://nvd.nist.gov/vuln/detail/CVE-2025-32711
author: PromptHound contributors
date: 2026-06-04
modified: 2026-09-26
license: DRL-1.1
logsource:
    product: llm_gateway
detection:
    untrusted_source:
        rag.source.types:
            - 'web'
            - 'email'
            - 'file'
            - 'ticket'
    phrase:
        gen_ai.input.messages|contains:
            - 'ignore previous instructions'
            - 'ignore all previous instructions'
            - 'disregard previous instructions'
            - 'new instructions:'
            - 'from now on you will'
            - 'forward the conversation'
            - 'exfiltrate'
            - 'send the contents to'
    scored:
        content.input.injection_markers|gte: 1
    condition: untrusted_source and phrase and scored
falsepositives:
    - Retrieved documents that quote injection phrases legitimately, such as security advisories or abuse reports.
    - Trusted sources labeled web or file by an over-broad source classifier; correct the labeling upstream.
    - Users who type an override phrase themselves while retrieval is active.
level: medium
prompthound:
    owasp_llm: [LLM01]
    atlas: [AML.T0051.001]
