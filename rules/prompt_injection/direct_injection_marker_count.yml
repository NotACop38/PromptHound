title: Multiple Injection Markers Scored on LLM Input
id: e9975d03-67ec-4e12-a309-c0c3a5393450
status: experimental
description: |
    Detects an input that the gateway's injection-marker detector scored with two or more
    prompt-injection or instruction-extraction markers. The rule reads only the derived
    marker count, so it runs without storing prompt text; its precision is the precision of
    the upstream detector. Pair it with the phrase-based rule where content logging is
    enabled.
references:
    - https://genai.owasp.org/llmrisk/llm01-prompt-injection/
    - https://atlas.mitre.org/techniques/AML.T0051.000
author: PromptHound contributors
date: 2026-06-04
modified: 2026-09-26
license: DRL-1.1
logsource:
    product: llm_gateway
detection:
    selection:
        content.input.injection_markers|gte: 2
    condition: selection
falsepositives:
    - A loosely tuned marker detector that scores benign inputs at two or more markers; calibrate the detector or raise the threshold.
    - Authorized red-team or regression suites that submit injection-rich inputs.
level: medium
prompthound:
    owasp_llm: [LLM01]
    atlas: [AML.T0051.000]
