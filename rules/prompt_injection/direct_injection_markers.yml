title: Instruction-Override Phrase in LLM Input
id: cc0cd2b6-0ef0-4782-99aa-a84c006b32c6
status: experimental
description: |
    Detects an input message that contains a common instruction-override phrase, such as
    "ignore previous instructions", when the gateway's injection-marker detector also scored
    the input. This indicates a direct prompt-injection attempt; it does not show that the
    model followed the injected instruction. Phrase matching is English-only and easy to
    evade, so treat an alert as a lead rather than a verdict.
references:
    - https://genai.owasp.org/llmrisk/llm01-prompt-injection/
    - https://atlas.mitre.org/techniques/AML.T0051.000
author: PromptHound contributors
date: 2026-06-04
modified: 2026-09-26
license: DRL-1.1
logsource:
    product: llm_gateway
detection:
    scored:
        content.input.injection_markers|gte: 1
    phrase:
        gen_ai.input.messages|contains:
            - 'ignore previous instructions'
            - 'ignore all previous instructions'
            - 'ignore the above instructions'
            - 'disregard previous instructions'
            - 'disregard all prior instructions'
            - 'forget your previous instructions'
            - 'override your instructions'
            - 'new instructions:'
            - 'from now on you will'
            - 'you must ignore'
    condition: scored and phrase
falsepositives:
    - Authorized red-team or regression testing of the application's own defenses.
    - Users quoting or discussing injection phrases, for example in a support request about the assistant, when the marker detector also scores the input.
level: medium
prompthound:
    owasp_llm: [LLM01]
    atlas: [AML.T0051.000]
