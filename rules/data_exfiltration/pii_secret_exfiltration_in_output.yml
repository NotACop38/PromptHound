# PromptHound — Sensitive-data / PII exfiltration detection.
# PRD §11 rule #5 (LLM02 Sensitive Information Disclosure). A Sigma
# *correlation* rule: the base detection flags a single response that carries
# PII or secret/credential classes in its OUTPUT; the correlation turns an
# abnormal volume of such responses to one principal into a bulk-exfiltration
# alert. One rule = one behavior: sensitive data egressing through the model's
# responses at volume.
#
# Tiering (PRD §11 #5 = T2 + T1): the base keys on the derived markers
# content.output.pii.types / content.output.secret.types (PRD §10.8 [D],
# privacy-preserving — class labels, not the values), and the per-principal
# windowed count is Tier-1 operational volume. See docs/authoring.md for the KQL
#
# P1: the rule keys on detected data *classes* (email, ssn, api_key …) and
# request volume — log signatures of exfiltration, never the exfiltrated values.
#
# Sample spec: generator/samples/pii_secret_exfiltration_in_output.{positive,negative}.json
---
title: LLM response carrying PII / secret classes (exfiltration building block)
name: exfil_sensitive_output
id: a336fa2c-ce2a-4aed-883f-7dd055c8e610
status: experimental
description: >
  A single LLM completion whose OUTPUT carries detected PII or secret/credential
  classes (derived markers content.output.pii.types / content.output.secret.types).
  On its own this can be legitimate; the correlation rule below turns an abnormal
  volume of these to one principal into a sensitive-data-exfiltration alert.
logsource:
  product: llm_gateway
detection:
  # Two fully-guarded arms: each carries the completion filter so the OR cannot
  # let a non-completion event (e.g. execute_tool) past on the secret branch
  # alone. (Splunk's implicit AND binds tighter than OR, so a shared `completion
  # and (a or b)` would render as `(completion and a) or b` and drop the filter
  # from the second arm.) The class-label arrays are matched *exactly* (no
  # `|contains`): these are discrete classifier labels, so substring matching
  # would let an unrelated future label like `not_email` count as sensitive.
  pii_in_output:
    event.action:
      - chat
      - text_completion
    # Derived marker (PRD §10.8): PII classes detected in the response.
    content.output.pii.types:
      - 'email'
      - 'ssn'
      - 'credit_card'
      - 'phone'
      - 'iban'
      - 'passport'
      - 'api_key'
  secret_in_output:
    event.action:
      - chat
      - text_completion
    # Derived marker (PRD §10.8): secret/credential classes detected in the response.
    content.output.secret.types:
      - 'api_key'
      - 'aws_access_key'
      - 'private_key'
      - 'bearer_token'
      - 'password'
      - 'jwt'
  condition: pii_in_output or secret_in_output
---
title: Repeated sensitive-output markers per principal
id: 5003fb2c-aa74-4b96-a00a-59a5792c5de1
status: experimental
description: >
  Detects a single principal (user.id) receiving an abnormally high number of
  LLM responses carrying PII or secret/credential classes within a short window
  — the log signature of sensitive-data exfiltration through the model's
  outputs (data harvested one query at a time, then aggregated). Aggregation is
  per-principal over a fixed UTC 10-minute window; the alert is the count of
  sensitive-data responses crossing a threshold, combining the content signal
  (what is in the output) with the Tier-1 volume signal (how much, to whom).
  See docs/deployment.md for the fixed UTC aggregation contract.
references:
  - https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/
  - https://atlas.mitre.org/techniques/AML.T0024
  - https://atlas.mitre.org/techniques/AML.T0025
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/
author: PromptHound contributors
date: 2026-06-04
tags:
  - owasp-llm.llm02
  - attack.atlas.aml.t0024
  - attack.atlas.aml.t0025
  - prompthound.tier.t1
correlation:
  type: event_count
  rules:
    - exfil_sensitive_output
  group-by:
    - user.tenant.id
    - user.id
  timespan: 10m
  condition:
    gte: 5
falsepositives:
  - Legitimate data-handling assistants (HR, CRM, support copilots) that return
    customer PII by design — scope by user.roles / app.name, or raise the
    threshold for known data-access principals.
  - Bulk export, backfill, or reporting workflows under a single service
    principal that surface many records of PII.
  - Over-eager PII/secret classifiers tagging benign tokens (e.g. any number as
    a "phone"); tune the gateway's derived-marker detectors.
level: high
