title: Sensitive Data Class in LLM Output
name: sensitive_data_in_output
id: a336fa2c-ce2a-4aed-883f-7dd055c8e610
status: experimental
description: |
    Building block for the correlation below: a completion whose response a detector
    labeled with a personal-data or credential class. Each alternative repeats the
    operation filter so that neither can match a non-completion event.
author: PromptHound contributors
date: 2026-06-04
modified: 2026-09-26
license: DRL-1.1
logsource:
    product: llm_gateway
detection:
    personal_data:
        gen_ai.operation.name:
            - 'chat'
            - 'text_completion'
            - 'generate_content'
        content.output.pii.types:
            - 'email'
            - 'phone'
            - 'ssn'
            - 'credit_card'
            - 'iban'
            - 'passport'
    credential:
        gen_ai.operation.name:
            - 'chat'
            - 'text_completion'
            - 'generate_content'
        content.output.secret.types:
            - 'api_key'
            - 'aws_access_key'
            - 'private_key'
            - 'bearer_token'
            - 'password'
            - 'jwt'
    condition: personal_data or credential
---
title: Repeated Sensitive Data in LLM Output for One Principal
id: 5003fb2c-aa74-4b96-a00a-59a5792c5de1
status: experimental
description: |
    Detects five or more responses labeled with personal-data or credential classes for
    one principal within a fixed 10-minute window. A single sensitive response can be
    legitimate; repeated ones for the same principal indicate data being harvested through
    the model. The rule reads the detector's class labels, never the sensitive values.
references:
    - https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/
    - https://atlas.mitre.org/techniques/AML.T0057
author: PromptHound contributors
date: 2026-06-04
modified: 2026-09-26
license: DRL-1.1
correlation:
    type: event_count
    rules:
        - sensitive_data_in_output
    group-by:
        - user.tenant.id
        - user.id
    timespan: 10m
    condition:
        gte: 5
falsepositives:
    - Assistants that return customer records by design, such as HR, CRM or support copilots; scope by service.name or user.roles.
    - Export or reporting jobs that run under one service principal.
    - An over-eager classifier that labels benign tokens, for example any number as a phone number.
level: high
prompthound:
    owasp_llm: [LLM02]
    atlas: [AML.T0057]
