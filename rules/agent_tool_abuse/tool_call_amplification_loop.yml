title: High Tool-Call Volume in One Conversation
id: 1d6f3b08-9c47-4a2e-8b51-5e2a7c0d9f84
status: experimental
description: |
    Detects fifteen or more tool calls or sub-agent invocations within one conversation in a
    fixed 2-minute window. A runaway or coerced agent that fans out or loops consumes API
    budget and downstream capacity with every call. The threshold is a starting point;
    baseline the normal fan-out of each agent before enabling alerts.
references:
    - https://genai.owasp.org/llmrisk/llm102025-unbounded-consumption/
    - https://genai.owasp.org/llmrisk/llm062025-excessive-agency/
    - https://atlas.mitre.org/techniques/AML.T0034.002
author: PromptHound contributors
date: 2026-06-04
modified: 2026-09-26
license: DRL-1.1
correlation:
    type: event_count
    rules:
        - agent_tool_invocation
    group-by:
        - user.tenant.id
        - gen_ai.conversation.id
    timespan: 2m
    condition:
        gte: 15
falsepositives:
    - Research, planning or data-pipeline agents whose normal turns fan out across many tools; scope by gen_ai.agent.name or raise the threshold.
    - Batch jobs that drive many tool calls under one conversation.
level: medium
prompthound:
    owasp_llm: [LLM10, LLM06]
    owasp_agentic: [ASI02]
    atlas: [AML.T0034.002]
