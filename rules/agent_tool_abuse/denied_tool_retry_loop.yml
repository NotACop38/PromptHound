title: Denied Agent Tool Call
name: denied_tool_call
id: 9c1a7e60-4d2b-4f8a-bb53-1e6c0a9d3f44
status: experimental
description: |
    Building block for the correlation below: a tool or agent invocation that an
    authorization policy denied.
author: PromptHound contributors
date: 2026-06-04
modified: 2026-09-26
license: DRL-1.1
logsource:
    product: llm_gateway
detection:
    selection:
        gen_ai.operation.name:
            - 'execute_tool'
            - 'invoke_agent'
        tool.call.outcome: 'denied'
    condition: selection
---
title: Repeated Denied Tool Calls in One Conversation
id: 4b7d2f81-3a59-46c0-9e1d-8f5b2c7a0e63
status: experimental
description: |
    Detects three or more denied tool calls within one conversation in a fixed 5-minute
    window. An agent that keeps invoking tools its policy refuses is probing for a path
    around the policy, often because injected instructions are steering it. One denial is
    routine; repetition is the signal.
references:
    - https://genai.owasp.org/llmrisk/llm062025-excessive-agency/
    - https://atlas.mitre.org/techniques/AML.T0053
author: PromptHound contributors
date: 2026-06-04
modified: 2026-09-26
license: DRL-1.1
correlation:
    type: event_count
    rules:
        - denied_tool_call
    group-by:
        - user.tenant.id
        - gen_ai.conversation.id
    timespan: 5m
    condition:
        gte: 3
falsepositives:
    - An agent retrying a tool that is out of scope for the tenant; grant or document the scope.
    - Transient authorization failures reported as denied during an outage; correlate with error.type.
    - Authorized agent-evaluation suites that probe tool boundaries.
level: medium
prompthound:
    owasp_llm: [LLM06]
    owasp_agentic: [ASI03]
    atlas: [AML.T0053]
