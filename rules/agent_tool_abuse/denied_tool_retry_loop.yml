# PromptHound — Agent tool-abuse detection.
# PRD §11 rule #6 (Agent tool-abuse: LLM06 / AI Agent Tools). A Sigma *correlation*
# rule: repeated *denied* tool calls within one conversation — the log signature
# of an agent (often steered by an injected instruction) hammering a tool the
# policy keeps refusing, probing for a path around the guardrail rather than
# backing off after the first denial.
#
# Tier 1 (PRD §10.5): the base detection keys on the always-on tool-call outcome
# metadata (`tool.call.outcome: denied`) + `event.action`; the correlation adds
# the per-conversation windowed count. No tool arguments or results (the T2
# fields) are inspected (PRD §8 P4). See docs/authoring.md for the KQL
#
# P1 (PRD §8): keys on the denied-then-retry *behaviour* in tool-call metadata,
# never on a working exploit.
#
# Sample spec: generator/samples/denied_tool_retry_loop.{positive,negative}.json
---
title: Denied agent tool call (retry-loop building block)
name: denied_tool_call
id: 9c1a7e60-4d2b-4f8a-bb53-1e6c0a9d3f44
status: experimental
description: >
  A single agent tool call the gateway refused (`tool.call.outcome: denied`).
  One denial is unremarkable — a tool out of scope, a missing permission; the
  correlation rule below turns a sustained run of them in one conversation into a
  guardrail-probing alert.
logsource:
  product: llm_gateway
detection:
  denied_tool:
    event.action:
      - execute_tool
      - invoke_agent
    tool.call.outcome: denied
  condition: denied_tool
---
title: Denied-then-retry agent tool loop per conversation
id: 4b7d2f81-3a59-46c0-9e1d-8f5b2c7a0e63
status: experimental
description: >
  Detects a single conversation (gen_ai.conversation.id) accumulating repeated
  denied tool calls within a short window — the log signature of an agent
  retrying a tool the policy keeps refusing, probing for a way past the guardrail
  instead of stopping after the first denial. Maps to OWASP LLM06:2025
  (Excessive Agency) and MITRE ATLAS AML.T0085.001 (AI Agent Tools) as context for attempted tool access. Aggregation is per-conversation over a fixed UTC
  5-minute window; the alert is the count of denied tool calls crossing a
  threshold. See docs/deployment.md for fixed UTC windows and tenant-scoped grouping.
references:
  - https://genai.owasp.org/llmrisk/llm062025-excessive-agency/
  - https://atlas.mitre.org/techniques/AML.T0085
author: PromptHound contributors
date: 2026-06-04
tags:
  - owasp-llm.llm06
  # OWASP Agentic AI — Threats and Mitigations (secondary mapping, PRD D6):
  # retrying a tool the policy keeps refusing, probing for a way past the
  # guardrail — T3 Privilege Compromise.
  - owasp-agentic.t03
  - attack.atlas.aml.t0085.001
  - prompthound.tier.t1
correlation:
  type: event_count
  rules:
    - denied_tool_call
  group-by:
    - user.tenant.id
    - gen_ai.conversation.id
  timespan: 5m
  condition:
    gte: 3
falsepositives:
  - A genuinely confused agent or user retrying a tool that is legitimately out
    of scope (e.g. a feature not enabled for this tenant) — review the denied
    tool and grant or document the scope, or raise the threshold.
  - Flaky permission checks returning transient `denied` during an outage;
    correlate with error.type and the gateway's authz logs.
  - Authorized red-team / agent-evaluation suites deliberately probing tool
    boundaries in one session (scope by app.env / user.roles).
level: medium
