title: Sensitive-Read and Egress Tools in One Agent Tool Chain
id: 2f8b1d4c-6e3a-4c1b-9d72-7a4e5f0c8b21
status: experimental
description: |
    Detects an agent tool chain that includes both a tool that reads sensitive data (files,
    databases, secrets, mailboxes) and a tool that sends data out (email, HTTP, webhooks,
    uploads). The combination is the shape of data exfiltration through agent tools. The
    rule tests co-occurrence only: it does not see call order, arguments, destinations or
    authorization. Tool names must match exactly (case-insensitively); replace the lists
    with your application's tool inventory, including namespaces.
references:
    - https://genai.owasp.org/llmrisk/llm062025-excessive-agency/
    - https://atlas.mitre.org/techniques/AML.T0086
    - https://atlas.mitre.org/techniques/AML.T0085.001
author: PromptHound contributors
date: 2026-06-04
modified: 2026-09-26
license: DRL-1.1
logsource:
    product: llm_gateway
detection:
    tool_operation:
        gen_ai.operation.name:
            - 'execute_tool'
            - 'invoke_agent'
    sensitive_read:
        tool.call.chain:
            - 'read_file'
            - 'fs.read'
            - 'db.query'
            - 'sql.query'
            - 'secrets.get'
            - 'vault.read'
            - 'kv.get'
            - 'read_email'
            - 'inbox.read'
            - 'get_credentials'
    egress:
        tool.call.chain:
            - 'send_email'
            - 'http.post'
            - 'http.request'
            - 'fetch_url'
            - 'upload_file'
            - 'post_webhook'
            - 'slack.post'
            - 'sftp.put'
    condition: tool_operation and sensitive_read and egress
falsepositives:
    - Automation that reads internal data and notifies an external channel by design, such as posting a database status to Slack; scope by gen_ai.agent.name or allowlist the chain.
    - Synchronization agents whose normal job is to read in one place and write in another.
level: medium
prompthound:
    owasp_llm: [LLM06]
    owasp_agentic: [ASI02]
    atlas: [AML.T0086, AML.T0085.001]
