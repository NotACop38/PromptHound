# Tool-name co-occurrence signal. Ordering and data flow are not inferred.
# Sample spec: generator/samples/anomalous_tool_call_chain.{positive,negative}.json
title: Sensitive-read and egress tool names in one chain
id: 2f8b1d4c-6e3a-4c1b-9d72-7a4e5f0c8b21
status: experimental
description: |
  Flags co-occurrence of sensitive-read and egress-like tool names within one
  chain. This does not test call order, arguments, destinations or authorization;
  it is a triage lead for potential tool misuse, not evidence of exfiltration.
  Adapt the name markers to the application's tool inventory and baseline
  legitimate read-and-notify workflows. Only Tier 1 metadata is required.
references:
  - https://genai.owasp.org/llmrisk/llm062025-excessive-agency/
  - https://atlas.mitre.org/techniques/AML.T0085
  - https://nvd.nist.gov/vuln/detail/CVE-2025-32711
author: PromptHound contributors
date: 2026-06-04
tags:
  - owasp-llm.llm06
  # OWASP Agentic AI — Threats and Mitigations (secondary mapping, PRD D6):
  # abusing integrated tools to read a sensitive source then egress it — T2 Tool
  # Misuse.
  - owasp-agentic.t02
  - attack.atlas.aml.t0085.001
  - prompthound.tier.t1
logsource:
  product: llm_gateway
  # Audit-log schema: docs/PRD.md §10.5 (Agent / tool-call).
detection:
  tool_turn:
    event.action:
      - execute_tool
      - invoke_agent
  # A privileged / sensitive-source read somewhere in the turn's chain.
  sensitive_source:
    tool.call.chain|contains:
      - 'read_file'
      - 'fs.read'
      - 'db.query'
      - 'sql.query'
      - 'secrets.get'
      - 'vault.read'
      - 'kv.get'
      - 'read_email'
      - 'inbox.read'
      - 'get_credentials'
  # An external egress / send tool somewhere in the same chain.
  external_sink:
    tool.call.chain|contains:
      - 'send_email'
      - 'http.post'
      - 'http.request'
      - 'fetch_url'
      - 'upload_file'
      - 'post_webhook'
      - 'slack.post'
      - 'sftp.put'
  condition: tool_turn and sensitive_source and external_sink
falsepositives:
  - Legitimate automation that reads internal data and then notifies an external
    channel by design (e.g. read a database row, post a status to Slack) — scope
    by app.name / gen_ai.agent.name, or allowlist the specific chain.
  - ETL / sync agents whose normal job is read-here, write-there; baseline the
    expected chains per agent and alert only on out-of-baseline combinations.
  - Coarse tool naming where one tool both reads and sends (review the agent's
    tool inventory and refine the marker lists to its actual tools).
level: high
