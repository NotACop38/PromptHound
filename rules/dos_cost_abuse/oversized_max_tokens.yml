title: Very Large Output Budget Requested
id: 1017dcbe-6c1f-40b7-bcdf-adc58a350df8
status: experimental
description: |
    Detects a completion request whose max_tokens is 100,000 or more. Requests for very
    long outputs are a direct lever on cost and latency. Some current models accept output
    budgets of this size legitimately, so this is a governance signal: set the threshold
    just above the largest budget each application is expected to request.
references:
    - https://genai.owasp.org/llmrisk/llm102025-unbounded-consumption/
    - https://atlas.mitre.org/techniques/AML.T0034.001
author: PromptHound contributors
date: 2026-06-04
modified: 2026-09-26
license: DRL-1.1
logsource:
    product: llm_gateway
detection:
    selection:
        gen_ai.operation.name:
            - 'chat'
            - 'text_completion'
            - 'generate_content'
        gen_ai.request.max_tokens|gte: 100000
    condition: selection
falsepositives:
    - Long-form generation jobs configured with high output budgets; scope by service.name or raise the threshold.
    - Clients that send the model's maximum budget by default without intending to use it.
level: low
prompthound:
    owasp_llm: [LLM10]
    atlas: [AML.T0034.001]
