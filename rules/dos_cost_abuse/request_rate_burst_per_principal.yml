            - 'generate_content'
    condition: selection
---
title: Completion Request Burst from One Principal
id: c399339c-8147-4dff-92c6-16588e7c92c7
status: experimental
description: |
    Detects twenty or more completion requests from one principal within a fixed 1-minute
    window, regardless of request size. High request frequency from a single identity
    degrades service for other users and raises cost. Set the threshold above the rate of
    each application's heaviest legitimate client.
references:
    - https://genai.owasp.org/llmrisk/llm102025-unbounded-consumption/
    - https://atlas.mitre.org/techniques/AML.T0034.000
    - https://atlas.mitre.org/techniques/AML.T0029
author: PromptHound contributors
date: 2026-06-04
modified: 2026-09-26
license: DRL-1.1
correlation:
    type: event_count
    rules:
        - completion_request
    group-by:
        - user.tenant.id
        - user.id
    timespan: 1m
    condition:
        gte: 20
falsepositives:
    - High-throughput service principals, evaluation harnesses or synthetic monitoring; scope by user.roles or raise the threshold.
    - Clients retrying during an error storm; correlate with error.type.
    - Load tests; filter by deployment.environment.name.
level: medium
prompthound:
    owasp_llm: [LLM10]
    atlas: [AML.T0034.000, AML.T0029]
