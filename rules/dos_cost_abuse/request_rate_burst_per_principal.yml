name: completion_request
id: 289509d2-7a37-43fa-b0ac-b7a3e19dd113
status: experimental
description: |
    Building block for the correlation below: any completion request.
author: PromptHound contributors
date: 2026-06-04
modified: 2026-09-26
license: DRL-1.1
logsource:
    product: llm_gateway
detection:
    selection:
        gen_ai.operation.name:
            - 'chat'
