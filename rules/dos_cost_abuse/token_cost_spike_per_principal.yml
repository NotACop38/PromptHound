title: High-Token Completion
name: high_token_completion
id: 767893f6-6e79-4169-aff4-ad7df990ea8e
status: experimental
description: |
    Building block for the correlation below: a completion that consumed 8,000 or more
    tokens in total.
author: PromptHound contributors
date: 2026-06-04
modified: 2026-09-26
license: DRL-1.1
logsource:
    product: llm_gateway
detection:
    selection:
        gen_ai.operation.name:
            - 'chat'
            - 'text_completion'
            - 'generate_content'
        usage.total_tokens|gte: 8000
    condition: selection
---
title: Repeated High-Token Completions for One Principal
id: b924da29-decc-44bc-9b56-2bdf66b4fafc
status: experimental
description: |
    Detects ten or more completions of 8,000 tokens or more for one principal within a fixed
    5-minute window. Sustained resource-intensive requests from one identity drive up cost
    (denial of wallet) and consume shared capacity. Both thresholds are starting points;
    set them from each application's normal usage.
references:
    - https://genai.owasp.org/llmrisk/llm102025-unbounded-consumption/
    - https://atlas.mitre.org/techniques/AML.T0034.001
author: PromptHound contributors
date: 2026-06-04
modified: 2026-09-26
license: DRL-1.1
correlation:
    type: event_count
    rules:
        - high_token_completion
    group-by:
        - user.tenant.id
        - user.id
    timespan: 5m
    condition:
        gte: 10
falsepositives:
    - Batch or backfill jobs under one service principal; scope by user.roles or raise the threshold for known principals.
    - Long-context summarization or retrieval workloads that routinely send large prompts.
level: medium
prompthound:
    owasp_llm: [LLM10]
    atlas: [AML.T0034.001]
