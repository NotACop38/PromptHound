title: Length-Truncated Completion
name: length_truncated_completion
id: 5baf2a8d-7362-4064-9f95-15951702da01
status: experimental
description: |
    Building block for the correlation below: a completion that stopped because it reached
    its output-token limit.
author: PromptHound contributors
date: 2026-06-04
modified: 2026-09-26
license: DRL-1.1
logsource:
    product: llm_gateway
detection:
    selection:
        gen_ai.operation.name:
            - 'chat'
            - 'text_completion'
            - 'generate_content'
        gen_ai.response.finish_reasons: 'length'
    condition: selection
---
title: Repeated Length-Truncated Completions in One Conversation
id: daea5beb-53d3-4ed6-bdce-cc642ed1f989
status: experimental
description: |
    Detects five or more completions that hit their output-token limit within one
    conversation in a fixed 5-minute window. An agent or auto-continue loop that keeps
    exhausting its output budget without converging burns tokens on every turn. Legitimate
    long-form generation also produces this pattern, so treat it as a hunting signal.
references:
    - https://genai.owasp.org/llmrisk/llm102025-unbounded-consumption/
    - https://atlas.mitre.org/techniques/AML.T0034
author: PromptHound contributors
date: 2026-06-04
modified: 2026-09-26
license: DRL-1.1
correlation:
    type: event_count
    rules:
        - length_truncated_completion
    group-by:
        - user.tenant.id
        - gen_ai.conversation.id
    timespan: 5m
    condition:
        gte: 5
falsepositives:
    - Clients that deliberately continue long outputs across several capped turns.
    - Summarization or translation of large documents split into capped chunks.
level: low
prompthound:
    owasp_llm: [LLM10]
    atlas: [AML.T0034]
