title: Filtered Jailbreak Attempt
name: filtered_jailbreak_attempt
id: 7acc3705-1ba3-408c-a549-f0cfbc536d49
status: experimental
description: |
    Building block for the correlation below: a completion whose input contains a persona or
    safety-bypass phrase and whose response was stopped by the content filter.
author: PromptHound contributors
date: 2026-06-04
modified: 2026-09-26
license: DRL-1.1
logsource:
    product: llm_gateway
detection:
    completion:
        gen_ai.operation.name:
            - 'chat'
            - 'text_completion'
            - 'generate_content'
    phrase:
        gen_ai.input.messages|contains:
            - 'you are now dan'
            - 'do anything now'
            - 'developer mode'
            - 'ignore your safety guidelines'
            - 'ignore your guidelines'
            - 'bypass your restrictions'
            - 'without any restrictions'
            - 'pretend you have no rules'
            - 'you have no content policy'
            - 'act as an unrestricted'
    filtered:
        gen_ai.response.finish_reasons: 'content_filter'
    condition: completion and phrase and filtered
---
title: Repeated Blocked Jailbreak Attempts in One Conversation
id: 413f181a-a47a-4213-ba58-0768307ec9dc
status: experimental
description: |
    Detects three or more content-filtered jailbreak attempts within one conversation in a
    fixed 10-minute window. Repetition distinguishes an adversary iterating on persona or
    safety-bypass framings from a single blocked request. Every counted attempt was blocked;
    look for an unfiltered response later in the same conversation to judge whether one
    succeeded.
references:
    - https://genai.owasp.org/llmrisk/llm01-prompt-injection/
    - https://atlas.mitre.org/techniques/AML.T0054
author: PromptHound contributors
date: 2026-06-04
modified: 2026-09-26
license: DRL-1.1
correlation:
    type: event_count
    rules:
        - filtered_jailbreak_attempt
    group-by:
        - user.tenant.id
        - gen_ai.conversation.id
    timespan: 10m
    condition:
        gte: 3
falsepositives:
    - Authorized red-team or safety-evaluation suites probing the content filter in one session.
    - A user rephrasing a benign request that an over-sensitive content filter keeps blocking.
level: medium
prompthound:
    owasp_llm: [LLM01]
    atlas: [AML.T0054]
