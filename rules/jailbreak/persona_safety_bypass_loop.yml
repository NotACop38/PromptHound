# PromptHound — Jailbreak detection.
# PRD §11 rule #4 (Jailbreaks: LLM01 ×LLM06 / ATLAS AML.T0054 LLM Jailbreak).
# A Sigma *correlation* rule: repeated jailbreak attempts in one conversation
# that the safety filter blocked. The base detection keys on persona / safety-
# bypass marker phrases in the input AND a `content_filter` finish reason (the
# attempt was caught); the correlation turns a sustained run of them within a
# short window into an alert — the log signature of an attacker iterating on a
# jailbreak rather than a one-off blocked turn.
#
# Tier-2: the base detection inspects input content (the persona/bypass markers).
# See docs/authoring.md for the KQL aggregation workaround (the Kusto backend
# does not emit Sigma correlations).
#
# P1 (PRD §8): the markers are recognizable jailbreak *intent* signatures
# ("you are now DAN", "developer mode", "ignore your safety guidelines"), not a
# working jailbreak prompt an attacker can lift and run.
#
# Sample spec: generator/samples/persona_safety_bypass_loop.{positive,negative}.json
---
title: Filtered jailbreak attempt (loop building block)
name: filtered_jailbreak_attempt
id: 7acc3705-1ba3-408c-a549-f0cfbc536d49
status: experimental
description: >
  A single conversational turn carrying a persona / safety-bypass marker phrase
  that the gateway's safety filter blocked (finish reason `content_filter`). One
  blocked attempt is unremarkable; the correlation rule below turns a sustained
  run of them in one conversation into a jailbreak-iteration alert.
logsource:
  product: llm_gateway
detection:
  attempt:
    event.action:
      - chat
      - text_completion
  bypass_markers:
    # Tier-2 content inspection: persona / safety-bypass jailbreak intent markers.
    # Recognizable signatures, not a working jailbreak payload (P1).
    gen_ai.input.messages|contains:
      - 'you are now dan'
      - 'do anything now'
      - 'developer mode'
      - 'ignore your safety guidelines'
      - 'ignore your guidelines'
      - 'bypass your restrictions'
      - 'without any restrictions'
      - 'pretend you have no rules'
      - 'you have no content policy'
      - 'act as an unrestricted'
  filtered:
    # The safety filter caught it — a blocked attempt, not a successful turn.
    gen_ai.response.finish_reasons: content_filter
  condition: attempt and bypass_markers and filtered
---
title: Repeated filtered jailbreak attempts per conversation
id: 413f181a-a47a-4213-ba58-0768307ec9dc
status: experimental
description: >
  Detects a single conversation (gen_ai.conversation.id) accumulating repeated
  safety-filtered jailbreak attempts within a short window — the log signature of
  an adversary iterating on persona / safety-bypass framings until one slips past
  the guardrail. Maps to OWASP LLM01:2025 (Prompt Injection) crossing LLM06:2025
  (Excessive Agency) and ATLAS AML.T0054 (LLM Jailbreak). Aggregation is
  per-conversation over a sliding 10-minute window; the alert is the count of
  filtered jailbreak attempts crossing a threshold. See docs/authoring.md for the
  KQL aggregation workaround (the Kusto backend does not emit Sigma correlations).
references:
  - https://genai.owasp.org/llmrisk/llm01-prompt-injection/
  - https://genai.owasp.org/llmrisk/llm062025-excessive-agency/
  - https://atlas.mitre.org/techniques/AML.T0054
author: PromptHound contributors
date: 2026-06-04
tags:
  - owasp-llm.llm01
  - owasp-llm.llm06
  - attack.atlas.aml.t0054
  - prompthound.tier.t2
correlation:
  type: event_count
  rules:
    - filtered_jailbreak_attempt
  group-by:
    - gen_ai.conversation.id
  timespan: 10m
  condition:
    gte: 3
falsepositives:
  - Authorized red-team / safety-evaluation suites deliberately probing the
    guardrail in one session (scope by app.env / user.roles).
  - A genuinely confused user repeatedly rephrasing a benign request that keeps
    tripping an over-sensitive content filter (review the filtered turns; tune
    the filter or raise the threshold).
level: high
