title: System-Prompt Content Detected in LLM Output
id: 05450153-9a94-4bbb-bae5-c9ba47c92f4f
related:
    - id: 7d0f4c5e-2b8a-4d63-9e1f-3a6c5b8e2d14
      type: similar
status: experimental
description: |
    Detects a response in which the gateway's output detector found content from the
    application's system instructions, for example through a canary token or similarity
    check. The rule reads only the derived flag, so it runs without storing response text.
    Review the response against the application's disclosure policy: some deployments
    intentionally reveal part of their instructions.
references:
    - https://genai.owasp.org/llmrisk/llm072025-system-prompt-leakage/
    - https://atlas.mitre.org/techniques/AML.T0056
author: PromptHound contributors
date: 2026-06-04
modified: 2026-09-26
license: DRL-1.1
logsource:
    product: llm_gateway
detection:
    selection:
        content.output.contains_system_prompt: true
    condition: selection
falsepositives:
    - Assistants that intentionally disclose a public portion of their instructions, such as a documented persona.
    - Detector false positives on short or generic instruction text; prefer canary-token checks where possible.
level: high
prompthound:
    owasp_llm: [LLM07]
    atlas: [AML.T0056]
