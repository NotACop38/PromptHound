# Possible exposure indicators; this is not confirmation of extraction success.
# The derived and content branches are alternatives with different prerequisites.
# Sample spec: generator/samples/system_prompt_leaked_in_output.{positive,negative}.json
title: Possible system-prompt exposure marker in LLM output
id: 05450153-9a94-4bbb-bae5-c9ba47c92f4f
status: experimental
description: |
  Flags a gateway-reported system-prompt similarity marker or an output phrase
  associated with discussing instructions. The derived boolean supports Tier 1;
  the alternative phrase branch requires Tier 2 content. Neither branch proves
  that a hidden or sensitive instruction was disclosed. Review the actual
  output against the application's intended disclosure policy before escalation.
  Maps to OWASP LLM07:2025 and ATLAS AML.T0056 as investigation context.
references:
  - https://genai.owasp.org/llmrisk/llm072025-system-prompt-leakage/
  - https://atlas.mitre.org/techniques/AML.T0056
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/
author: PromptHound contributors
date: 2026-06-04
tags:
  - owasp-llm.llm07
  - attack.atlas.aml.t0056
  - prompthound.tier.t1
  - prompthound.tier.t2
logsource:
  product: llm_gateway
  # Audit-log schema: docs/PRD.md §10 (LLM Gateway / Agent Audit Log).
detection:
  leaked_marker:
    # Derived Tier-1 marker (PRD §10.8): the gateway scored the output as
    # echoing the system instructions. Runs without persisting raw text.
    content.output.contains_system_prompt: true
  leaked_in_output_text:
    # Tier-2 content inspection: the response recites its own hidden
    # instructions. Generalizable echo signatures, not exploit payloads (P1).
    gen_ai.output.messages|contains:
      - 'you are a helpful assistant'
      - 'my system prompt'
      - 'my system instructions'
      - 'my initial instructions'
      - 'here are my instructions'
      - 'the system prompt is'
      - 'my instructions are'
      - 'i was instructed to'
  condition: leaked_marker or leaked_in_output_text
falsepositives:
  - Developers, red-teamers, or security researchers reviewing their own
    application's prompt during authorized testing.
  - Assistants that intentionally and safely disclose a public, non-sensitive
    portion of their system prompt (e.g. a documented persona blurb).
  - Conversations that legitimately quote the phrase "you are a helpful
    assistant" while discussing prompt engineering (tune/remove that marker, or
    rely on the derived contains_system_prompt boolean alone).
level: high
