x-sensitive-response: &sensitive-response
  gen_ai.usage.output_tokens: 1200
  guardrail.output.flagged: true
  guardrail.output.categories: [pii]
  content.output.pii.types: [email, ssn]

cases:
  - name: Five responses with personal data for one principal
    expect: alert
    alerts: 1
    events:
      - prompt: Show me the full record for the next customer.
        response: Here is the customer record you requested.
        set: *sensitive-response
        repeat: 5
        interval: 90s

  - name: Credential classes count as sensitive
    expect: alert
    events:
      - response: Here is the configuration file you asked for.
        set:
          content.output.pii.types: []
          content.output.secret.types: [api_key]
        repeat: 5
        interval: 90s

  - name: Four sensitive responses stay below the threshold
    expect: silent
    events:
      - response: Here is the customer's contact email.
        set:
          content.output.pii.types: [email]
        repeat: 4
        interval: 90s

  - name: Unlisted class labels are not counted
    expect: silent
    events:
      - set:
          content.output.pii.types: [ip_address, email_domain]
        repeat: 5
        interval: 90s

  - name: Sensitive labels on tool events are not counted
    expect: silent
    events:
      - set:
          gen_ai.operation.name: execute_tool
          content.output.secret.types: [api_key]
        repeat: 5
        interval: 90s

  - name: Sensitive responses split across two principals
    expect: silent
    events:
      - set:
          <<: *sensitive-response
          user.id: user-exfil-a
        repeat: 3
        interval: 60s
      - set:
          <<: *sensitive-response
          user.id: user-exfil-b
        repeat: 3
        interval: 60s
