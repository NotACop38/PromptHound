
[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Possible system-prompt exposure marker in LLM output]
description = Flags a gateway-reported system-prompt similarity marker or an output phrase \
associated with discussing instructions. The derived boolean supports Tier 1; \
the alternative phrase branch requires Tier 2 content. Neither branch proves \
that a hidden or sensitive instruction was disclosed. Review the actual \
output against the application's intended disclosure policy before escalation. \
Maps to OWASP LLM07:2025 and ATLAS AML.T0056 as investigation context.
search = content_output_contains_system_prompt=true OR gen_ai_output_messages IN ("*you are a helpful assistant*", "*my system prompt*", "*my system instructions*", "*my initial instructions*", "*here are my instructions*", "*the system prompt is*", "*my instructions are*", "*i was instructed to*")
