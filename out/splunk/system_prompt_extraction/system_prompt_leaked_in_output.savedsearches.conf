
[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[System Prompt Leaked in LLM Output (extraction success)]
description = Detects a successful system-prompt / instruction extraction: the model's \
response echoes its hidden system instructions back to the user. Fires when \
the gateway's derived marker content.output.contains_system_prompt is true \
(Tier-1 bridge, PRD §10.8) OR an output message carries a recognizable \
system-prompt-echo signature (Tier-2 content inspection). \
 \
This is the success counterpart to extract_system_prompt_markers.yml (which \
catches the attempt in the input). Confirming the leak in the output is high \
fidelity and supports incident response: the secret is already out. \
 \
Maps to OWASP LLM07:2025 (System Prompt Leakage) and ATLAS AML.T0056 \
(LLM Meta Prompt Extraction). P1 note: the echo phrases are generalizable \
signatures of a model reciting its own instructions, not a curated payload.
search = content_output_contains_system_prompt=true OR gen_ai_output_messages IN ("*you are a helpful assistant*", "*my system prompt*", "*my system instructions*", "*my initial instructions*", "*here are my instructions*", "*the system prompt is*", "*my instructions are*", "*i was instructed to*")
