
[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Repeated filtered jailbreak attempts per conversation]
description = Detects a single conversation (gen_ai.conversation.id) accumulating repeated safety-filtered jailbreak attempts within a short window — the log signature of an adversary iterating on persona / safety-bypass framings until one slips past the guardrail. Maps to OWASP LLM01:2025 (Prompt Injection) crossing LLM06:2025 (Excessive Agency) and ATLAS AML.T0054 (LLM Jailbreak). Aggregation is per-conversation over a fixed UTC 10-minute window; the alert is the count of filtered jailbreak attempts crossing a threshold. See docs/deployment.md for the fixed UTC aggregation contract.
search = event_action IN ("chat", "text_completion") gen_ai_input_messages IN ("*you are now dan*", "*do anything now*", "*developer mode*", "*ignore your safety guidelines*", "*ignore your guidelines*", "*bypass your restrictions*", "*without any restrictions*", "*pretend you have no rules*", "*you have no content policy*", "*act as an unrestricted*") gen_ai_response_finish_reasons="content_filter" \
 \
| bin _time span=10m \
| stats count as event_count by _time user_tenant_id gen_ai_conversation_id \
 \
| search event_count >= 3
