
[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Sensitive-data / PII exfiltration via LLM output (abnormal volume per principal)]
description = Detects a single principal (user.id) receiving an abnormally high number of LLM responses carrying PII or secret/credential classes within a short window — the log signature of sensitive-data exfiltration through the model's outputs (data harvested one query at a time, then aggregated). Aggregation is per-principal over a sliding 10-minute window; the alert is the count of sensitive-data responses crossing a threshold, combining the content signal (what is in the output) with the Tier-1 volume signal (how much, to whom). See docs/authoring.md for the KQL aggregation workaround (the Kusto backend does not emit Sigma correlations).
search = (event_action IN ("chat", "text_completion") content_output_pii_types IN ("email", "ssn", "credit_card", "phone", "iban", "passport", "api_key")) OR (event_action IN ("chat", "text_completion") content_output_secret_types IN ("api_key", "aws_access_key", "private_key", "bearer_token", "password", "jwt")) \
 \
| bin _time span=10m \
| stats count as event_count by _time user_id \
 \
| search event_count >= 5
