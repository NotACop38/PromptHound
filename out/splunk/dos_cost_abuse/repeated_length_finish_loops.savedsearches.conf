
[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Repeated length-finish loop per conversation (denial of wallet)]
description = Detects a single conversation (gen_ai.conversation.id) accumulating repeated `length`-truncated completions within a short window — the log signature of an agent or auto-continue loop that keeps maxing out the output budget and being re-prompted, burning tokens without converging (OWASP LLM10:2025 Unbounded Consumption). Aggregation is per-conversation over a sliding 5-minute window; the alert is the count of truncated completions crossing a threshold, a Tier-1 proxy for a runaway loop. See docs/authoring.md for the KQL aggregation workaround (the Kusto backend does not emit Sigma correlations).
search = event_action IN ("chat", "text_completion") gen_ai_response_finish_reasons="length" \
 \
| bin _time span=5m \
| stats count as event_count by _time gen_ai_conversation_id \
 \
| search event_count >= 5
