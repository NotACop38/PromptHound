
[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Request-rate burst per principal (denial of service / wallet)]
description = Detects a single principal (user.id) issuing an abnormally high number of LLM completion requests within a short window — the log signature of model/endpoint denial-of-service and automated cost-abuse driven by request *frequency* rather than per-request token size. Aggregation is per-principal over a fixed UTC 1-minute window; the alert is the request count crossing a threshold, a Tier-1 proxy for a runaway client or abusive script. See docs/deployment.md for fixed UTC windows and tenant-scoped grouping.
search = event_action IN ("chat", "text_completion") \
 \
| bin _time span=1m \
| stats count as event_count by _time user_tenant_id user_id \
 \
| search event_count >= 20
