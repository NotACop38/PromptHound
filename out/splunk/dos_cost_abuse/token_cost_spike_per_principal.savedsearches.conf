
[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Repeated high-token completions per principal]
description = Detects a single principal (user.id) issuing a burst of high-token LLM completions within a short window — the log signature of model/endpoint denial-of-service and cost-abuse (denial-of-wallet). Aggregation is per-principal over a fixed UTC 5-minute window; the alert is the count of high-token completions crossing a threshold, a Tier-1 proxy for a runaway token/cost spike. See docs/deployment.md for fixed UTC windows and tenant-scoped grouping.
search = event_action IN ("chat", "text_completion") gen_ai_usage_total_tokens>=8000 \
 \
| bin _time span=5m \
| stats count as event_count by _time user_tenant_id user_id \
 \
| search event_count >= 10
