
[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Resource-amplifying agent tool-call chain per conversation]
description = Detects a single conversation (gen_ai.conversation.id) issuing an abnormally high number of tool calls within a short window — the log signature of a runaway agent or tool-calling chain that fans out and amplifies downstream resource and cost consumption (each tool call is an API hit and frequently another model turn). Bridges OWASP LLM06:2025 (Excessive Agency) and LLM10:2025 (Unbounded Consumption) and maps to MITRE ATLAS AML.TA0015 (Command and Control) with AML.T0034 (Cost Harvesting) / AML.T0029 (Denial of ML Service). Aggregation is per-conversation over a sliding 2-minute window; the alert is the tool-call count crossing a threshold. See docs/authoring.md for the KQL aggregation workaround (the Kusto backend does not emit Sigma correlations).
search = event_action IN ("execute_tool", "invoke_agent") \
 \
| bin _time span=2m \
| stats count as event_count by _time gen_ai_conversation_id \
 \
| search event_count >= 15
