
[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Denied-then-retry agent tool loop per conversation]
description = Detects a single conversation (gen_ai.conversation.id) accumulating repeated denied tool calls within a short window — the log signature of an agent retrying a tool the policy keeps refusing, probing for a way past the guardrail instead of stopping after the first denial. Maps to OWASP LLM06:2025 (Excessive Agency) and MITRE ATLAS AML.TA0015 (Command and Control) via AML.T0085.001 (AI Agent Tools). Aggregation is per-conversation over a sliding 5-minute window; the alert is the count of denied tool calls crossing a threshold. See docs/authoring.md for the KQL aggregation workaround (the Kusto backend does not emit Sigma correlations).
search = event_action IN ("execute_tool", "invoke_agent") tool_call_outcome="denied" \
 \
| bin _time span=5m \
| stats count as event_count by _time gen_ai_conversation_id \
 \
| search event_count >= 3
