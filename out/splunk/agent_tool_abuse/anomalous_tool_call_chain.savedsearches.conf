
[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Sensitive-read and egress tool names in one chain]
description = Flags co-occurrence of sensitive-read and egress-like tool names within one \
chain. This does not test call order, arguments, destinations or authorization; \
it is a triage lead for potential tool misuse, not evidence of exfiltration. \
Matches complete tool names, case-insensitively. Adapt the names to the \
application's tool inventory (including namespaces and suffixes) and baseline \
legitimate read-and-notify workflows. Only Tier 1 metadata is required.
search = event_action IN ("execute_tool", "invoke_agent") tool_call_chain IN ("read_file", "fs.read", "db.query", "sql.query", "secrets.get", "vault.read", "kv.get", "read_email", "inbox.read", "get_credentials") tool_call_chain IN ("send_email", "http.post", "http.request", "fetch_url", "upload_file", "post_webhook", "slack.post", "sftp.put")
