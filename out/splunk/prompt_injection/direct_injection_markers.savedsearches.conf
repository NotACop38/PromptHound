
[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Direct Prompt-Injection Instruction-Override Markers in LLM Input]
description = Detects a direct prompt-injection attempt: input text instructing the model to \
override, ignore, or replace its own (system) instructions. This is the core of \
OWASP LLM01:2025 (Prompt Injection) and ATLAS AML.T0051.000 (LLM Prompt \
Injection: Direct), where the adversary supplies the malicious instruction \
directly in their own prompt (as opposed to via retrieved content — see the \
indirect rule). \
 \
Tier-2 (+D): fires when an input message carries a recognizable \
instruction-override marker phrase AND the derived content.input.injection_markers \
counter is non-zero. The derived counter raises fidelity so a benign mention of \
"instructions" does not fire on its own.
search = content_input_injection_markers>=1 gen_ai_input_messages IN ("*ignore previous instructions*", "*ignore all previous instructions*", "*ignore the above instructions*", "*disregard previous instructions*", "*disregard all prior instructions*", "*forget your previous instructions*", "*override your instructions*", "*new instructions:*", "*from now on you will*", "*you must ignore*")
