
[default]
dispatch.earliest_time = -30d
dispatch.latest_time = now

[Indirect Prompt-Injection Markers from Untrusted Retrieved Content]
description = Detects indirect prompt injection: instruction-override markers appearing in a \
retrieval-augmented turn whose retrieved content came from an untrusted source \
type (web, email, file, ticket). This is OWASP LLM01:2025 (Prompt Injection) \
and ATLAS AML.T0051.001 (LLM Prompt Injection: Indirect), where an adversary \
plants instructions in content the application later retrieves and feeds to the \
model — the M365 Copilot EchoLeak class of attack (CVE-2025-32711). \
 \
Tier-2 + retrieval: requires (1) an untrusted rag.source.types entry, (2) a \
recognizable instruction-override marker phrase in the assembled input, and \
(3) a non-zero derived injection-marker counter. Trusted-source retrieval (e.g. \
an internal `db`) with no markers stays silent.
search = rag_source_types IN ("web", "email", "file", "ticket") gen_ai_input_messages IN ("*ignore previous instructions*", "*ignore all previous instructions*", "*disregard previous instructions*", "*new instructions:*", "*from now on you will*", "*forward the conversation*", "*exfiltrate*", "*send the contents to*") content_input_injection_markers>=1
