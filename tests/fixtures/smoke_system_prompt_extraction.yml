title: System-prompt extraction attempt (toolchain smoke fixture)
id: 8d4a1f2e-9c3b-4e7a-bf21-0a1b2c3d4e5f
status: experimental
description: >
  Toolchain smoke fixture (PRD §11 slice #3, system-prompt / instruction
  extraction). Keys on Tier-1 / derived signals — a guardrail extraction verdict
  plus an injection-marker count — rather than any raw prompt string, so it stays
  a log *signature*, not a payload (PRD §8 P1). Used only to prove Sigma → SPL +
  KQL conversion before real rules are authored; not part of the shipped pack.
author: PromptHound contributors
date: 2026/06/04
references:
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/
  - https://atlas.mitre.org/techniques/AML.T0056
logsource:
  product: llm_gateway
detection:
  selection:
    event.action: chat
    guardrail.input.categories|contains: instruction_extraction
  markers:
    content.input.injection_markers|gte: 1
  condition: selection and markers
falsepositives:
  - Security researchers or red-teamers probing the gateway with consent.
  - Users legitimately asking the assistant to describe its own configuration.
level: high
tags:
  - owasp-llm.llm07
  - attack.atlas.aml.t0056
  - prompthound.tier.t1
